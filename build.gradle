plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id("gg.jte.gradle") version("3.1.12")
}

group = 'org.svenehrke'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'

    annotationProcessor 'io.soabase.record-builder:record-builder-processor:37'
    compileOnly 'io.soabase.record-builder:record-builder-core:37'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation "gg.jte:jte:${deps_jte_version}"
    // https://lorefnon.me/2022/04/26/using-jte-kotlin-templates-in-spring-boot/
    implementation "gg.jte:jte-spring-boot-starter-3:${deps_jte_version}"
    implementation 'de.tschuehly:spring-view-component-jte:0.8.4'

    implementation 'org.webjars.npm:htmx.org:1.9.8'
    implementation 'org.webjars.npm:hyperscript.org:0.9.12'

    implementation 'org.webjars.npm:picocss__pico:2.0.0-alpha1'
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation 'io.vavr:vavr:0.10.4'
    implementation 'com.baloise.webjars:baloise-design-system:16.2.1'
    implementation 'org.webjars:webjars-locator:0.52'
}

tasks.named('test') {
    useJUnitPlatform()
}

jte {
    precompile()
//    sourceDirectory = java.nio.file.Path.of("src/main/java")
    sourceDirectory = java.nio.file.Path.of("src/main/jte")
}
